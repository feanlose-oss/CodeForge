<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">

<title>CodeForge Core V1.1</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#070b10;
    --panel:#0d131a;
    --panel2:#111922;
    --editor:#080c10;
    --border:#23303b;
    --text:#edf2f7;
    --muted:#7f8c98;
    --green:#35e985;
    --green2:#18b963;
    --red:#ff5f6d;
    --blue:#4c9cff;
    --yellow:#ffd166;
}

body{
    min-height:100vh;
    background:
        radial-gradient(
            circle at 15% 0%,
            rgba(53,233,133,.12),
            transparent 30%
        ),
        radial-gradient(
            circle at 100% 10%,
            rgba(76,156,255,.10),
            transparent 30%
        ),
        var(--bg);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
}

/* ================= HEADER ================= */

header{
    height:58px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 14px;
    background:rgba(7,11,16,.94);
    border-bottom:1px solid var(--border);
    backdrop-filter:blur(15px);
    position:relative;
    z-index:50;
}

.logo{
    display:flex;
    align-items:center;
    gap:9px;
    font-size:18px;
    font-weight:900;
}

.logo-icon{
    width:34px;
    height:34px;
    display:grid;
    place-items:center;
    border-radius:9px;
    background:linear-gradient(
        135deg,
        var(--green),
        var(--green2)
    );
    color:#031108;
    font-weight:900;
}

.logo span{
    color:var(--green);
}

.header-actions{
    display:flex;
    align-items:center;
    gap:7px;
}

button,
select{
    min-height:34px;
    padding:0 11px;
    border:1px solid var(--border);
    border-radius:8px;
    background:var(--panel2);
    color:var(--text);
    font-size:13px;
    cursor:pointer;
}

button:hover{
    border-color:#3c4d59;
}

button:active{
    transform:translateY(1px);
}

.run-btn{
    background:var(--green);
    border-color:var(--green);
    color:#031108;
    font-weight:900;
}

.run-btn:hover{
    background:#4af497;
}

.icon-btn{
    width:36px;
    padding:0;
}

/* ================= APP ================= */

.app{
    height:calc(100vh - 58px);
    display:flex;
}

/* ================= SIDEBAR ================= */

.sidebar{
    width:235px;
    min-width:235px;
    background:rgba(13,19,26,.98);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
}

.sidebar-title{
    height:48px;
    padding:0 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid var(--border);
    color:var(--muted);
    font-size:12px;
    font-weight:800;
}

.file-list{
    flex:1;
    overflow:auto;
    padding:8px;
}

.file{
    width:100%;
    min-height:38px;
    display:flex;
    align-items:center;
    gap:9px;
    padding:0 10px;
    margin-bottom:3px;
    border-radius:7px;
    color:#c9d1d9;
    cursor:pointer;
}

.file:hover{
    background:#17212a;
}

.file.active{
    background:#192b24;
    color:var(--green);
}

.file-icon{
    width:18px;
    text-align:center;
    flex-shrink:0;
}

.file-name{
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.sidebar-bottom{
    padding:9px;
    border-top:1px solid var(--border);
}

.new-file{
    width:100%;
}

/* ================= WORKSPACE ================= */

.workspace{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
}

.editor-top{
    height:48px;
    min-height:48px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 12px;
    background:var(--panel);
    border-bottom:1px solid var(--border);
}

.current-file{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
}

.file-dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--green);
    box-shadow:0 0 10px rgba(53,233,133,.5);
}

.editor-actions{
    display:flex;
    align-items:center;
    gap:6px;
}

.snippet-btn{
    color:var(--green);
}

/* ================= EDITOR ================= */

.editor-area{
    flex:1;
    min-height:0;
    display:flex;
    background:var(--editor);
}

.lines{
    width:50px;
    min-width:50px;
    overflow:hidden;
    padding:15px 8px 15px 0;
    text-align:right;
    color:#4d5a65;
    background:#090d12;
    border-right:1px solid #18232c;
    font:14px/1.55 Consolas,Monaco,"Courier New",monospace;
    user-select:none;
}

.line-number{
    height:21.7px;
}

.code-wrap{
    position:relative;
    flex:1;
    min-width:0;
    min-height:0;
}

textarea{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    padding:15px;
    border:0;
    outline:0;
    resize:none;
    background:transparent;
    color:#e7edf2;
    caret-color:var(--green);
    font:14px/1.55 Consolas,Monaco,"Courier New",monospace;
    tab-size:4;
    white-space:pre;
    overflow:auto;
}

textarea::selection{
    background:rgba(53,233,133,.22);
}

/* ================= BOTTOM ================= */

.bottom{
    height:210px;
    min-height:150px;
    display:flex;
    flex-direction:column;
    background:#090e13;
    border-top:1px solid var(--border);
}

.bottom-head{
    height:40px;
    min-height:40px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 12px;
    border-bottom:1px solid var(--border);
}

.tabs{
    height:100%;
    display:flex;
    align-items:center;
    gap:16px;
}

.tab{
    height:100%;
    display:flex;
    align-items:center;
    color:var(--muted);
    font-size:12px;
    cursor:pointer;
    border-bottom:2px solid transparent;
}

.tab.active{
    color:var(--text);
    border-bottom-color:var(--green);
}

.output{
    flex:1;
    overflow:auto;
    padding:12px;
    white-space:pre-wrap;
    color:#cbd5dd;
    font:13px/1.5 Consolas,Monaco,monospace;
}

.output.success{
    color:var(--green);
}

.output.error{
    color:var(--red);
}

.output-info{
    color:var(--blue);
}

/* ================= SNIPPET PANEL ================= */

.snippet-panel{
    position:absolute;
    top:48px;
    right:12px;
    width:280px;
    max-height:380px;
    overflow:auto;
    display:none;
    padding:8px;
    background:#101820;
    border:1px solid var(--border);
    border-radius:10px;
    box-shadow:0 20px 50px rgba(0,0,0,.5);
    z-index:30;
}

.snippet-panel.show{
    display:block;
}

.snippet-title{
    padding:7px 8px 10px;
    color:var(--muted);
    font-size:11px;
    font-weight:800;
    text-transform:uppercase;
}

.snippet-item{
    width:100%;
    min-height:42px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:0 10px;
    margin-bottom:3px;
    border-radius:7px;
    background:transparent;
    border:1px solid transparent;
    color:var(--text);
    cursor:pointer;
    text-align:left;
}

.snippet-item:hover{
    background:#18242d;
    border-color:var(--border);
}

.snippet-key{
    color:var(--green);
    font-family:Consolas,monospace;
    font-weight:700;
}

.snippet-desc{
    color:var(--muted);
    font-size:11px;
    text-align:right;
}

/* ================= MODAL ================= */

.modal-bg{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.65);
    backdrop-filter:blur(4px);
    z-index:100;
}

.modal-bg.show{
    display:flex;
}

.modal{
    width:100%;
    max-width:390px;
    padding:18px;
    background:#101820;
    border:1px solid var(--border);
    border-radius:13px;
    box-shadow:0 25px 70px rgba(0,0,0,.5);
}

.modal h2{
    margin-bottom:14px;
    font-size:17px;
}

.modal input{
    width:100%;
    height:42px;
    padding:0 12px;
    border:1px solid var(--border);
    border-radius:8px;
    outline:none;
    background:#080d12;
    color:white;
    font-size:14px;
}

.modal-buttons{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:14px;
}

/* ================= TOAST ================= */

.toast{
    position:fixed;
    left:50%;
    bottom:20px;
    transform:translate(-50%,20px);
    opacity:0;
    pointer-events:none;
    padding:10px 15px;
    background:#111b23;
    border:1px solid var(--border);
    border-radius:9px;
    font-size:13px;
    z-index:200;
    transition:.2s;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

/* ================= MOBILE ================= */

.mobile-menu{
    display:none;
}

@media(max-width:700px){

    .sidebar{
        position:absolute;
        top:58px;
        left:0;
        bottom:0;
        z-index:40;
        transform:translateX(-100%);
        transition:.2s;
        box-shadow:10px 0 30px rgba(0,0,0,.4);
    }

    .sidebar.open{
        transform:translateX(0);
    }

    .mobile-menu{
        display:block;
    }

    .header-actions button:not(.run-btn){
        display:none;
    }

    .header-actions select{
        max-width:105px;
    }

    .bottom{
        height:185px;
    }

    .snippet-panel{
        top:48px;
        right:8px;
        left:8px;
        width:auto;
    }
}
</style>
</head>

<body>

<script>
"use strict";

/*
==================================================
 CODEFORGE CORE V1.1
 HTML SNIPPET ENGINE
==================================================
*/

/* =================================================
   DEFAULT FILES
================================================= */

const DEFAULT_FILES = [

    {
        name:"index.html",
        language:"html",
        code:`<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeForge</title>
</head>
<body>

    <h1>Hello, CodeForge!</h1>

</body>
</html>`
    },

    {
        name:"style.css",
        language:"css",
        code:`body {
    background:#101820;
    color:white;
    font-family:Arial,sans-serif;
}

h1 {
    color:#35e985;
}`
    },

    {
        name:"script.js",
        language:"javascript",
        code:`console.log("JavaScript ishlayapti!");`
    },

    {
        name:"main.py",
        language:"python",
        code:`print("Hello from Python!")`
    }

];


/* =================================================
   STATE
================================================= */

let files = [];
let activeFileIndex = 0;


/* =================================================
   DOM
================================================= */

const editor =
    document.getElementById("editor");

const lineNumbers =
    document.getElementById("lineNumbers");

const fileList =
    document.getElementById("fileList");

const currentFileName =
    document.getElementById("currentFileName");

const languageSelect =
    document.getElementById("languageSelect");

const output =
    document.getElementById("output");

const fileCount =
    document.getElementById("fileCount");

const modalBg =
    document.getElementById("modalBg");

const fileNameInput =
    document.getElementById("fileNameInput");

const toast =
    document.getElementById("toast");

const sidebar =
    document.getElementById("sidebar");

const snippetPanel =
    document.getElementById("snippetPanel");

const snippetBtn =
    document.getElementById("snippetBtn");


/* =================================================
   LOCAL STORAGE
================================================= */

function saveProject(){

    try{

        localStorage.setItem(
            "codeforge_project_v11",
            JSON.stringify(files)
        );

        localStorage.setItem(
            "codeforge_active_v11",
            String(activeFileIndex)
        );

        showToast(
            "Loyiha saqlandi ✅"
        );

    }catch(error){

        showToast(
            "Saqlash xatosi: " +
            error.message
        );
    }
}


function loadProject(){

    try{

        const saved =
            localStorage.getItem(
                "codeforge_project_v11"
            );

        if(saved){

            const parsed =
                JSON.parse(saved);

            if(
                Array.isArray(parsed) &&
                parsed.length > 0
            ){

                files = parsed;

                const index =
                    Number(
                        localStorage.getItem(
                            "codeforge_active_v11"
                        )
                    );

                if(
                    Number.isInteger(index) &&
                    index >= 0 &&
                    index < files.length
                ){

                    activeFileIndex = index;

                }else{

                    activeFileIndex = 0;
                }

                return;
            }
        }

    }catch(error){

        console.warn(
            "Storage yuklanmadi:",
            error
        );
    }

    files =
        JSON.parse(
            JSON.stringify(DEFAULT_FILES)
        );

    activeFileIndex = 0;
}


/* =================================================
   LANGUAGE DETECTION
================================================= */

function detectLanguage(fileName){

    const name =
        fileName.toLowerCase();

    if(
        name.endsWith(".html") ||
        name.endsWith(".htm")
    )
        return "html";

    if(name.endsWith(".css"))
        return "css";

    if(name.endsWith(".js"))
        return "javascript";

    if(name.endsWith(".py"))
        return "python";

    if(name.endsWith(".java"))
        return "java";

    if(
        name.endsWith(".cpp") ||
        name.endsWith(".cc") ||
        name.endsWith(".cxx")
    )
        return "cpp";

    if(name.endsWith(".c"))
        return "c";

    if(name.endsWith(".cs"))
        return "csharp";

    if(name.endsWith(".php"))
        return "php";

    if(name.endsWith(".sql"))
        return "sql";

    if(name.endsWith(".json"))
        return "json";

    if(
        name.endsWith(".sh") ||
        name.endsWith(".bash")
    )
        return "bash";

    return "text";
}


/* =================================================
   FILE ICON
================================================= */

function getFileIcon(language){

    const icons = {

        html:"🌐",
        css:"🎨",
        javascript:"🟨",
        python:"🐍",
        java:"☕",
        cpp:"⚙️",
        c:"⚙️",
        csharp:"🔷",
        php:"🐘",
        sql:"🗄️",
        json:"📋",
        bash:"⌨️",
        text:"📄"

    };

    return icons[language] || "📄";
}


/* =================================================
   FILE RENDER
================================================= */

function renderFiles(){

    fileList.innerHTML = "";

    files.forEach(
        (file,index) => {

            const item =
                document.createElement("div");

            item.className =
                "file" +
                (
                    index === activeFileIndex
                        ? " active"
                        : ""
                );

            const icon =
                document.createElement("span");

            icon.className =
                "file-icon";

            icon.textContent =
                getFileIcon(file.language);

            const name =
                document.createElement("span");

            name.className =
                "file-name";

            name.textContent =
                file.name;

            item.appendChild(icon);
            item.appendChild(name);

            item.addEventListener(
                "click",
                () => openFile(index)
            );

            fileList.appendChild(item);
        }
    );

    fileCount.textContent =
        files.length;
}


/* =================================================
   OPEN FILE
================================================= */

function openFile(index){

    if(
        index < 0 ||
        index >= files.length
    )
        return;

    activeFileIndex = index;

    const file =
        files[index];

    editor.value =
        file.code;

    currentFileName.textContent =
        file.name;

    languageSelect.value =
        file.language;

    updateLineNumbers();

    renderFiles();

    closeSnippetPanel();

    output.className =
        "output";

    output.textContent =
        `📄 ${file.name} ochildi.\n\n` +
        `Til: ${file.language}\n\n` +
        `▶ Run tugmasini bosing.`;

    closeSidebarMobile();
}


/* =================================================
   CODE SYNC
================================================= */

function updateCurrentCode(){

    if(!files[activeFileIndex])
        return;

    files[activeFileIndex].code =
        editor.value;
}


/* =================================================
   LINE NUMBERS
================================================= */

function updateLineNumbers(){

    const text =
        editor.value || "";

    const count =
        Math.max(
            1,
            text.split("\n").length
        );

    let html = "";

    for(
        let i = 1;
        i <= count;
        i++
    ){

        html +=
            `<div class="line-number">${i}</div>`;
    }

    lineNumbers.innerHTML =
        html;

    lineNumbers.scrollTop =
        editor.scrollTop;
}


/* =================================================
   HTML SNIPPETS
================================================= */

const HTML_SNIPPETS = {

    "!": {
        value:
`<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

</body>
</html>`,
        cursor:"<body>\n\n"
    },

    "html:5": {
        value:
`<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

</body>
</html>`,
        cursor:"<body>\n\n"
    },

    "div": {
        value:"<div></div>",
        cursor:"<div>"
    },

    "p": {
        value:"<p></p>",
        cursor:"<p>"
    },

    "a": {
        value:'<a href=""></a>',
        cursor:'<a href="">'
    },

    "img": {
        value:'<img src="" alt="">',
        cursor:'<img src="">'
    },

    "button": {
        value:"<button></button>",
        cursor:"<button>"
    },

    "input": {
        value:'<input type="text">',
        cursor:'<input type="text">'
    },

    "ul": {
        value:"<ul>\n    <li></li>\n</ul>",
        cursor:"<ul>\n    <li>"
    },

    "li": {
        value:"<li></li>",
        cursor:"<li>"
    },

    "script": {
        value:"<script>\n\n</script>",
        cursor:"<script>\n"
    },

    "style": {
        value:"<style>\n\n</style>",
        cursor:"<style>\n"
    },

    "link": {
        value:'<link rel="stylesheet" href="">',
        cursor:'<link rel="stylesheet" href="'
    }

};


/*
    Finds the current word immediately
    before the cursor.
*/

function getCurrentToken(){

    const cursor =
        editor.selectionStart;

    const before =
        editor.value.slice(
            0,
            cursor
        );

    const match =
        before.match(
            /([^\s<>]+)$/
        );

    return match
        ? match[1]
        : "";
}


/*
    Replace current token with snippet.
*/

function expandSnippet(){

    if(
        files[activeFileIndex]?.language !==
        "html"
    ){

        return false;
    }

    const token =
        getCurrentToken();

    if(!token)
        return false;

    const snippet =
        HTML_SNIPPETS[token];

    if(!snippet)
        return false;

    const cursor =
        editor.selectionStart;

    const tokenStart =
        cursor - token.length;

    const before =
        editor.value.slice(
            0,
            tokenStart
        );

    const after =
        editor.value.slice(
            cursor
        );

    editor.value =
        before +
        snippet.value +
        after;

    /*
        Determine cursor position.

        For simple snippets, put cursor
        inside the opening element.

        For the HTML5 template, put it
        inside <body>.
    */

    let newCursor;

    if(
        token === "!" ||
        token === "html:5"
    ){

        const bodyPosition =
            snippet.value.indexOf(
                "<body>"
            );

        newCursor =
            tokenStart +
            bodyPosition +
            "<body>".length +
            1;

    }else{

        const marker =
            snippet.cursor;

        newCursor =
            tokenStart +
            marker.length;
    }

    editor.selectionStart =
        newCursor;

    editor.selectionEnd =
        newCursor;

    updateCurrentCode();
    updateLineNumbers();

    showToast(
        `Snippet "${token}" qo'shildi ✨`
    );

    return true;
}


/* =================================================
   TAB HANDLER
================================================= */

editor.addEventListener(
    "keydown",
    event => {

        if(event.key !== "Tab")
            return;

        /*
            If Shift + Tab:
            currently keep normal browser
            behavior disabled and insert nothing.
        */

        if(event.shiftKey)
            return;

        event.preventDefault();

        /*
            FIRST:
            Try HTML snippet.
        */

        if(expandSnippet()){

            return;
        }

        /*
            SECOND:
            If there is no snippet,
            preserve the original
            4-space Tab behavior.
        */

        const start =
            editor.selectionStart;

        const end =
            editor.selectionEnd;

        const value =
            editor.value;

        editor.value =
            value.slice(0,start) +
            "    " +
            value.slice(end);

        editor.selectionStart =
            start + 4;

        editor.selectionEnd =
            start + 4;

        updateCurrentCode();
        updateLineNumbers();
    }
);


/* =================================================
   EDITOR INPUT
================================================= */

editor.addEventListener(
    "input",
    () => {

        updateCurrentCode();

        updateLineNumbers();
    }
);


/* =================================================

================================================= */

editor.addEventListener(

/* =================================================
   SNIPPET PANEL
================================================= */

function openSnippetPanel(){

    if(

function closeSnippetPanel(){

document

/*
    Insert snippet directly from
    the Snippets panel.
*/

function insertNamedSnippet(key){

    if(
        files[activeFileIndex]?.language !==
        "html"
    ){

        showToast(
            "Bu snippet faqat HTML uchun."
        );

        return;
    }

    const snippet =
        HTML_SNIPPETS[key];

    if(!snippet)
        return;

    const start =
        editor.selectionStart;

    const end =
        editor.selectionEnd;

    const before =
        editor.value.slice(
            0,
            start
        );

    const after =
        editor.value.slice(
            end
        );

    editor.value =
        before +
        snippet.value +
        after;

    let cursor;

    if(
        key === "!" ||
        key === "html:5"
    ){

        const bodyPosition =
            snippet.value.indexOf(
                "<body>"
            );

        cursor =
            start +
            bodyPosition +
            "<body>".length +
            1;

    }else{

        cursor =
            start +
            snippet.cursor.length;
    }

    editor.selectionStart =
        cursor;

    editor.selectionEnd =
        cursor;

    updateCurrentCode();
    updateLineNumbers();

    showToast(
        `Snippet "${key}" qo'shildi ✨`
    );
}


/* =================================================
   RUN
================================================= */

function runCode(){

    updateCurrentCode();

    const file =
        files[activeFileIndex];

    if(!file)
        return;

    if(
        file.language === "html" ||
        file.language === "css" ||
        file.language === "javascript"
    ){

        runWebProject();

        return;
    }

    output.className =
        "output";

    output.innerHTML =
        `<span class="output-info">` +
        `CodeForge Runtime\n\n` +
        `Til: ${escapeHTML(file.language)}\n` +
        `Fayl: ${escapeHTML(file.name)}\n\n` +
        `⚙️ Bu til uchun runtime/compiler ` +
        `hali ulanmagan.\n\n` +
        `Kod editor va loyiha tizimida ` +
        `saqlanmoqda.` +
        `</span>`;
}


/* =================================================
   WEB RUNNER
================================================= */

function runWebProject(){

    const htmlFile =
        files.find(
            file =>
                file.language === "html"
        );

    const css =
        files
            .filter(
                file =>
                    file.language === "css"
            )
            .map(
                file => file.code
            )
            .join("\n\n");

    const js =
        files
            .filter(
                file =>
                    file.language === "javascript"
            )
            .map(
                file => file.code
            )
            .join("\n\n");

    let html =
        htmlFile
            ? htmlFile.code
            : "";


    if(
        !/<html[\s>]/i.test(html)
    ){

        html =
`<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
${css}
</style>
</head>
<body>
${html}
<script>
${js}
<\/script>
</body>
</html>`;
    }else{

        if(css){

            html =
                html.replace(
                    /<\/head>/i,
                    `<style>${css}</style></head>`
                );
        }

        if(js){

            html =
                html.replace(
                    /<\/body>/i,
                    `<script>${js}<\/script></body>`
                );
        }
    }


    const blob =
        new Blob(
            [html],
            {
                type:"text/html"
            }
        );

    const url =
        URL.createObjectURL(blob);

    const win =
        window.open(
            url,
            "_blank"
        );

    if(!win){

        output.className =
            "output error";

        output.textContent =
            "❌ Browser popup oynasini blokladi.\n" +
            "Popup ruxsatini yoqing.";

    }else{

        output.className =
            "output success";

        output.textContent =
            "✅ Web loyiha ishga tushirildi.\n\n" +
            "HTML + CSS + JavaScript bajarildi.";
    }

    setTimeout(
        () => {

            URL.revokeObjectURL(
                url
            );

        },
        60000
    );
}


/* =================================================
   NEW FILE
================================================= */

function openNewFileModal(){

    modalBg.classList.add(
        "show"
    );

    fileNameInput.value =
        "";

    setTimeout(
        () => fileNameInput.focus(),
        50
    );
}


function closeNewFileModal(){

    modalBg.classList.remove(
        "show"
    );
}


function createNewFile(){

    let name =
        fileNameInput.value.trim();

    if(!name){

        showToast(
            "Fayl nomini kiriting."
        );

        return;
    }

    name =
        name.replace(
            /[\\/:*?"<>|]/g,
            "_"
        );

    if(
        files.some(
            file =>
                file.name.toLowerCase() ===
                name.toLowerCase()
        )
    ){

        showToast(
            "Bunday fayl mavjud."
        );

        return;
    }

    const language =
        detectLanguage(name);

    files.push({

        name:name,

        language:language,

        code:""
    });

    activeFileIndex =
        files.length - 1;

    closeNewFileModal();

    renderFiles();

    openFile(
        activeFileIndex
    );

    saveProject();
}

   CLEAR EDITOR
================================================= */

    if(

            "Editor ichidagi kodni tozalaysizmi?"

    )

}

================================================= */

            output.textContent =

        }
    );


/* =================================================
   ESCAPE HTML
================================================= */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =================================================
   TOAST
================================================= */

let toastTimer = null;

function showToast(message){

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        toastTimer
    );

    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            1800
        );
}
